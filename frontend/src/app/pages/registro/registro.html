<div class="registro-page">

  <div class="registro-card">

    <div class="brand">
      <h1>MENSTYLE</h1>
      <p>Moda masculina a tu estilo</p>
    </div>

    <h2>Crear cuenta</h2>
    <p class="subtitle">Regístrate para comenzar</p>

    @if (error) {
      <div class="error">
        {{ error }}
      </div>
    }

    @if (mensaje) {
      <div class="success">
        {{ mensaje }}
      </div>
    }

    <form (ngSubmit)="registrar()">

      <div class="row">

        <div class="field">
          <label for="nombre">Nombre</label>
          <input
            id="nombre"
            type="text"
            name="nombre"
            [(ngModel)]="nombre"
            placeholder="Tu nombre"
          />
        </div>

        <div class="field">
          <label for="apellido">Apellido</label>
          <input
            id="apellido"
            type="text"
            name="apellido"
            [(ngModel)]="apellido"
            placeholder="Tu apellido"
          />
        </div>

      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="correo@ejemplo.com"
        />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Crea una contraseña"
        />
      </div>

      <button
        type="submit"
        [disabled]="cargando">

        @if (cargando) {
          Creando cuenta...
        } @else {
          Registrarse
        }

      </button>

    </form>

    <p class="login-link">
      ¿Ya tienes una cuenta?
      <a (click)="volverLogin()">Iniciar sesión</a>
    </p>

  </div>

</div>
